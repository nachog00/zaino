[tasks.changeset-validate]
description = "Validate all .changeset/*.md files"
command = "cargo"
args = ["run", "--package", "xtask", "--", "versioning", "changeset", "validate"]

[tasks.changeset-new]
description = "Create a new changeset file from the current branch name"
command = "cargo"
args = ["run", "--package", "xtask", "--", "versioning", "changeset", "new"]

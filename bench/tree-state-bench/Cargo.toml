[package]
name = "tree-state-bench"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Scratch measurement harness: times PR #1638's tree-state index on a synced zaino LMDB store"

[[bin]]
name = "tree-state-bench"
path = "src/main.rs"

[dependencies]
# The index under measurement (its real writer, store and serving path).
zaino-index-tree-state = { path = "../../packages/zaino-index-tree-state" }
zaino-persistence = { path = "../../packages/zaino-persistence" }
zaino-primitives.workspace = true
zaino-sync.workspace = true

# Commitment-tree root recomputation for the zebra cross-check.
incrementalmerkletree = { workspace = true, features = ["legacy-api"] }
orchard.workspace = true
sapling-crypto.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json.workspace = true
hex.workspace = true

# The data source: OUR synced store, opened read-only with the raw lmdb crate.
lmdb = "0.8"

[lints.rust]
unsafe_code = "forbid"

[package]
name = "source-bench"
description = "Proficiency benchmark for Zaino source-port implementations: drives the same hot-op suite through each validator source (ZebraRpcAdapter and ZebraReadStateAdapter, via ValidatorClient) on an identical basis and reports latency/throughput."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
version = "0.1.0"
publish = false

[[bin]]
name = "source-bench"
path = "src/main.rs"

[dependencies]
# Source seam: the two adapters under test, wrapped in ValidatorClient, plus the
# canonical port traits and the domain primitives they speak.
zaino-source = { workspace = true }
zaino-primitives = { workspace = true }
zaino-rpc = { workspace = true }
zaino-source-zebra-rpc = { workspace = true, features = ["tracing"] }
zaino-source-zebra-readstate = { workspace = true, features = ["tracing"] }
zebra-chain = { workspace = true }

tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
hdrhistogram = "7"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
hex.workspace = true
reqwest.workspace = true

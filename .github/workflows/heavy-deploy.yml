name: Heavy Deploy

# Dispatched by RC Update when a new RC is cut. Creates a GitHub
# deployment for the RC commit in the heavy-test environment.
# The external system (k8s) picks up the deployment and runs long
# sync / soak tests. Can also be triggered manually.

on:
  workflow_dispatch:
    inputs:
      rc_sha:
        description: "RC commit SHA"
        required: true
      rc_tag:
        description: "RC release tag (e.g. 2026-05-01-rc.0)"
        required: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy for Heavy Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rc_sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags origin

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Deploy for heavy testing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo run --package xtask -- versioning deploy-heavy-test \
            --rc-sha ${{ inputs.rc_sha }} \
            --rc-tag ${{ inputs.rc_tag }}

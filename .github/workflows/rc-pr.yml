name: RC Pull Request

on:
  workflow_run:
    workflows: [Heavy Validate]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create/Update PR to stable
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validated-rc
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags origin

      - uses: dtolnay/rust-toolchain@stable

      - name: Check if stable exists
        id: check-stable
        run: |
          if git ls-remote --heads origin stable | grep -q stable; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate PR content
        if: steps.check-stable.outputs.exists == 'true'
        id: content
        run: |
          TITLE=$(cargo run --package xtask -- versioning release-pr-title)
          echo "title=$TITLE" >> $GITHUB_OUTPUT

          COMMENT=$(cargo run --package xtask -- versioning release-rc-comment \
            --short-sha "$(git rev-parse --short HEAD)")
          echo "comment=$COMMENT" >> $GITHUB_OUTPUT

          {
            echo "body<<PRBODYEOF"
            cargo run --package xtask -- versioning release-pr-body
            echo "PRBODYEOF"
          } >> $GITHUB_OUTPUT

      - name: Create or update PR
        if: steps.check-stable.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --base stable --head validated-rc --json number --jq '.[0].number' 2>/dev/null || echo "")

          cat <<'PRBODY' > /tmp/pr-body.md
          ${{ steps.content.outputs.body }}
          PRBODY

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "${{ steps.content.outputs.title }}" \
              --body-file /tmp/pr-body.md
            gh pr comment "$EXISTING_PR" \
              --body "${{ steps.content.outputs.comment }}"
          else
            gh pr create --base stable --head validated-rc \
              --title "${{ steps.content.outputs.title }}" \
              --body-file /tmp/pr-body.md
          fi

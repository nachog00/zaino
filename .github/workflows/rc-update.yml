name: RC Update

on:
  workflow_run:
    workflows: [CI - Nightly]
    types: [completed]
    branches: [dev]

permissions:
  contents: write
  actions: write

concurrency:
  group: rc-update
  cancel-in-progress: true

jobs:
  advance-rc:
    name: Advance RC
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      rc_cut: ${{ steps.advance.outputs.rc_cut }}
      rc_tag: ${{ steps.advance.outputs.rc_tag }}
      rc_sha: ${{ steps.advance.outputs.rc_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags
        run: git fetch --tags origin

      - uses: dtolnay/rust-toolchain@stable
      - uses: knope-dev/action@v2.1.2

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Advance RC
        id: advance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo run --package xtask -- versioning advance-rc \
            --green-commit ${{ github.event.workflow_run.head_sha }}

  deploy-heavy-test:
    name: Dispatch Heavy Deploy
    needs: advance-rc
    if: needs.advance-rc.outputs.rc_cut == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch heavy deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run heavy-deploy.yml \
            --repo ${{ github.repository }} \
            -f rc_sha=${{ needs.advance-rc.outputs.rc_sha }} \
            -f rc_tag=${{ needs.advance-rc.outputs.rc_tag }}
